name: CI

on:
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  java-build:
    name: java-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build and test
        working-directory: java
        run: mvn -B verify

      - name: Publish snapshot to GitHub Packages
        working-directory: java
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ui-build:
    name: ui-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@dakshverma2411"

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Compute PR snapshot version
        id: version
        working-directory: ui
        run: |
          SHA="${GITHUB_SHA:0:7}"
          VERSION="0.0.0-pr${{ github.event.pull_request.number }}.${SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set PR snapshot version
        working-directory: ui
        run: npm version --no-git-tag-version "${{ steps.version.outputs.version }}"

      - name: Publish snapshot to GitHub Packages
        working-directory: ui
        run: npm publish --tag pr-${{ github.event.pull_request.number }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
