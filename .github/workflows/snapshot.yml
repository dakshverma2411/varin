name: Snapshot

on:
  push:
    branches: [develop]

concurrency:
  group: snapshot-develop
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  java-snapshot:
    name: java-snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build, test and deploy snapshot
        working-directory: java
        run: mvn -B deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ui-snapshot:
    name: ui-snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@dakshverma2411"

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Compute develop snapshot version
        id: version
        working-directory: ui
        run: |
          BASE=$(node -p "require('./package.json').version")
          SHA="${GITHUB_SHA:0:7}"
          VERSION="${BASE}-snapshot.${SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set snapshot version
        working-directory: ui
        run: npm version --no-git-tag-version "${{ steps.version.outputs.version }}"

      - name: Publish snapshot to GitHub Packages
        working-directory: ui
        run: npm publish --tag snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
